<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solv 연습 · 5지선다</title>
  <style>
    :root {
      --ink: #1a1f2e;
      --muted: #5c6578;
      --line: #e2e6ef;
      --bg: #f7f8fb;
      --card: #ffffff;
      --accent: #2f6fed;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #dfe9ff 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #eef2ff 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .sheet {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 40px 32px;
      box-shadow: 0 18px 50px rgba(26, 31, 46, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.45;
      margin: 0 0 28px;
      font-weight: 700;
    }
    ol {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    li {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.4;
      background: #fff;
    }
    li span {
      display: inline-flex;
      width: 28px;
      height: 28px;
      margin-right: 10px;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
      background: #eef3ff;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      vertical-align: middle;
    }
    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #eef1f7;
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="badge">연습 문제 · 정답은 2번</div>
    <h1>다음 중 지구에서 태양까지 평균 거리를 나타내는 단위는?</h1>
    <ol>
      <li><span>1</span>광년 (light-year)</li>
      <li><span>2</span>천문단위 (AU)</li>
      <li><span>3</span>파섹 (parsec)</li>
      <li><span>4</span>해리 (nautical mile)</li>
      <li><span>5</span>옹스트롬 (ångström)</li>
    </ol>
    <p class="hint">
      Solv 테스트: 이 문제만 드래그하려면 <code>⌘⌥C</code> · 전체 화면은 <code>⌘⌥</code><br />
      정답이면 Caps Lock이 <strong>2번</strong> 깜빡여야 합니다.
    </p>
  </main>
</body>
</html>
